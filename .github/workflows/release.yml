name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的 tag，例如 v1.0.0"
        required: true

permissions:
  contents: write

jobs:
  windows-exe:
    name: 打包 Windows exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build
        run: python -m PyInstaller --noconfirm --clean packaging/campusnet.spec

      - name: Smoke test exe
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
        run: |
          dist\auto-net\campusnet.exe --version
          if ($LASTEXITCODE -ne 0) { throw "campusnet.exe --version 失败" }
          dist\auto-net\campusnet.exe --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "campusnet.exe --help 失败" }
          Get-ChildItem dist\auto-net

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path dist\auto-net\* -DestinationPath auto-net-windows-x64.zip -Force
          Get-Item auto-net-windows-x64.zip | Select-Object Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: auto-net-windows-x64
          path: auto-net-windows-x64.zip
          retention-days: 14

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" auto-net-windows-x64.zip `
            --title "${{ github.ref_name }}" `
            --generate-notes
