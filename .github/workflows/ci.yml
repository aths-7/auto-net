name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    env:
      # Windows runner 是英文环境，强制 UTF-8 输出，否则中文日志会炸
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.8", "3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Show version
        run: python -V

      - name: Run unit tests
        run: python -m unittest discover -s tests -t . -v

      - name: Smoke test CLI
        shell: bash
        run: |
          python -m campusnet --version
          python -m campusnet --help
          # 未 init 时 doctor 会报配置问题并以 1 退出，这属于预期行为
          python -m campusnet doctor || echo "doctor 报告配置问题（未 init，预期内）"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Byte-compile all sources
        run: python -m compileall -q campusnet tests

  package:
    # 打包配置只在发版时才会用到，不在这里验一遍就得等 tag 那天才发现炸了
    name: 打包校验 (windows exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pyinstaller
      - run: python -m PyInstaller --noconfirm --clean packaging/campusnet.spec
      - name: Verify exe
        shell: pwsh
        run: |
          dist\auto-net\campusnet.exe --version
          if ($LASTEXITCODE -ne 0) { throw "打包后的 exe 无法运行" }
          Test-Path dist\auto-net\campusnet-daemon.exe
