name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.8", "3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Show version
        run: python -V

      - name: Run unit tests
        run: python -m unittest discover -s tests -t . -v

      - name: Smoke test CLI
        shell: bash
        run: |
          python -m campusnet --version
          python -m campusnet --help
          # 未 init 时 doctor 会报配置问题并以 1 退出，这属于预期行为
          python -m campusnet doctor || echo "doctor 报告配置问题（未 init，预期内）"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Byte-compile all sources
        run: python -m compileall -q campusnet tests
